services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      PORT: 3000
      INSTANCE_ID: api1
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api2:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      PORT: 3000
      INSTANCE_ID: api2
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./Backend
    command: node worker.js
    env_file:
      - ./Backend/.env
    environment:
      INSTANCE_ID: worker
      WORKER_ID: worker-1
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped
