upstream catalog {
    server api1:3000 max_fails=1 fail_timeout=5s;
    server api2:3000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    client_max_body_size 50M;

    location / {
        proxy_pass http://catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass_header X-Instance-Id;
        proxy_pass_header X-Cache;
        proxy_pass_header X-Correlation-Id;
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header X-RateLimit-Reset;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
}
